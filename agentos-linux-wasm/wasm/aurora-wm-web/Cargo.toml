[package]
name = "aurora-wm-web"
version = "0.3.1"
edition = "2021"
description = "Browser WASM port of ecooxai/aurora-wm with real rusttype font rendering"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
image = { version = "=0.24.9", default-features = false, features = ["png"] }
rusttype = "0.9.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
